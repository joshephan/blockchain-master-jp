[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "osaka"
remappings = ["forge-std/=lib/forge-std/src/"]

# 第144講: 古いハードフォークのチェーンにも載せられるようにistanbulでビルドした版(PUSH0なし)
[profile.istanbul]
evm_version = "istanbul"
out = "out-istanbul"

[lint]
lint_on_build = false

# 第143講: 命令一つ一つのガスをトレースで見るためにoptimizerをオフにした版
[profile.cost]
optimizer = false
out = "out-cost"
