[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# コンパイラ・ビルドの設定は前の版(通しプロジェクトのMarket)の値をそのまま持ってくる。選び直しは設計文書で
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "osaka"
remappings = ["forge-std/=lib/forge-std/src/"]
bytecode_hash = "ipfs"
cbor_metadata = true

# リバートした行を探すときに回し直す版(FOUNDRY_PROFILE=debug)。optimizerは切る、デプロイしない
[profile.debug]
optimizer = false
via_ir = false
out = "out-debug"

[fmt]
line_length = 120
tab_width = 4
style = "space"
quote_style = "double"

[lint]
lint_on_build = false
